# Local and linked project configuration.
# project_id is filled after `supabase link`.

project_id = "ututhxkwvhpnoyrfjzbu"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 5000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.record-simbox-event]
verify_jwt = false
# Public case tracking. JWT is not used: learners are anonymous.
# Authorization is origin CORS + payload validation + service-role insert.
# Do not set verify_jwt = true; GitHub Pages cannot present a user JWT.

[functions.admin-delete-simbox-events]
verify_jwt = true
# Dashboard admins only. JWT required. Service role is used only after admin_users check.
